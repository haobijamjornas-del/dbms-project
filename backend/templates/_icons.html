{% macro logo(size=30) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true">
<rect width="32" height="32" rx="9" fill="url(#mc-logo)"/>
<defs><linearGradient id="mc-logo" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#3f4fd8"/><stop offset="1" stop-color="#1f9d93"/></linearGradient></defs>
<path d="M9 22c0-7.2 5.8-13 13-13h1.5v1.5c0 7.2-5.8 13-13 13H9V22z" fill="#fff"/>
<path d="M10.5 22.5c3.2-3.4 6.6-6 10.5-8.4" stroke="#3f4fd8" stroke-width="1.7" stroke-linecap="round" fill="none"/>
</svg>
{%- endmacro %}

{% macro mood_face(key, size=32) -%}
<svg class="mood-face" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<circle cx="12" cy="12" r="10"/>
<path d="M9 9.6h.01" stroke-width="2.6"/><path d="M15 9.6h.01" stroke-width="2.6"/>
{%- if key == 'rough' -%}
<path d="M8 17c1.1-1.7 2.4-2.5 4-2.5s2.9.8 4 2.5"/><path d="M7.6 7.4 10 8.4"/><path d="m16.4 7.4-2.4 1"/>
{%- elif key == 'low' -%}
<path d="M8.6 16.2c1-.9 2.1-1.3 3.4-1.3s2.4.4 3.4 1.3"/>
{%- elif key == 'okay' -%}
<path d="M8.8 15.3h6.4"/>
{%- elif key == 'good' -%}
<path d="M8.5 14.3c1 1.1 2.1 1.7 3.5 1.7s2.5-.6 3.5-1.7"/>
{%- else -%}
<path d="M7.8 13.6h8.4c-.5 2.3-2.2 3.8-4.2 3.8s-3.7-1.5-4.2-3.8Z" fill="currentColor" fill-opacity=".18"/>
{%- endif -%}
</svg>
{%- endmacro %}
